[project]
name = "pgagent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "abd-1211", email = "abdullah5678910@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.13.0",
    "apscheduler>=3.11.3",
    "fastapi>=0.143.0",
    "pglast>=8.5",
    "pgvector>=0.5.1",
    "psycopg[binary,pool]>=3.3.6",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.15.0",
    "uvicorn>=0.54.0",
]

[project.scripts]
pgagent = "pgagent:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]
